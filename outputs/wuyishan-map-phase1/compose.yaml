services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: wymap
      POSTGRES_USER: wymap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wymap"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
